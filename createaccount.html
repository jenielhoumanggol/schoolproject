<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<style>
    body {
        background: linear-gradient(135deg, #e9d5ff, #bae6fd);
        font-family: "Segoe UI", Roboto, Arial;
        color: #1f2937;
        text-align: justify; 
        margin: 0;
        height: 100vh;
    }   
</style>
</head>

<body>
<center>
<form action="https://jenielhoumanggol.github.io/schoolproject/accountcreated.html" style="background-color:#a2bbee; padding:10px; width:50%; border-radius:12px; margin:auto; margin-top:100px;">
    
    <div style="background-color:white; padding:20px; border-radius:10px;">
        
        <h2>Create Account</h2>

        <label><h4>Full Name</h4></label>
        <input type="text" style="width:90%; padding:8px;">

        <label><h4>Email Address</h4></label>
        <input type="email" style="width:90%; padding:8px;">

        <label><h4>Password</h4></label>
        <input type="password" style="width:90%; padding:8px;"><br><br>

        <input type="submit" value="Create Account"
        style="width:95%; padding:10px; background-color:#007bff; color:white; border:none; border-radius:5px;">

        <br><br>

        Already have an account?
        <a href="https://jenielhoumanggol.github.io/schoolproject/sign-in.html">Sign In</a>

    </div>

</form>
</center>
</body>
</html>
