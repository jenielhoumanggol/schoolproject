<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e9deff, #bae6fd);
      margin: 0;
      height: 100vh;
      text-align: center;
      position: relative; 
    }

    
    .box {
      background: white;
      width: 350px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);

      position: absolute; 
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    h2 { 
      font-size: 28px; 
      margin-bottom: 10px; 
    }

    label { 
      display: block; 
      text-align: left; 
      margin-bottom: 5px; 
      font-weight: bold; 
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    a.button {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      background: #007BFF;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 10px;
    }

    a.button:hover { background: #0056cc; }

    p a { 
      color: #007BFF; 
      font-weight: bold; 
      text-decoration: none; 
    }

    p a:hover { text-decoration: underline; }
  </style>
</head>

<body>

  <div class="box">
    <h2>Create Account</h2>

    <label>Full Name</label>
    <input type="text">

    <label>Email Address</label>
    <input type="email">

    <label>Password</label>
    <input type="password">

    <a href="accountcreated.html" class="button">Create Account</a>

    <p>Already have an account? <a href="sign-in.html">Sign In</a></p>
  </div>

</body>
</html>
