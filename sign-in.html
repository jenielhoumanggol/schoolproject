<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e9deff, #bae6fd);
            margin: 0;
            height: 100vh;

           
            position: relative;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;

           
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        h2 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        p {
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 14px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            font-size: 14px;
        }

       
        button {
            width: 100%;
            padding: 12px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #0056cc;
        }

        .signup {
            margin-top: 15px;
            font-size: 14px;
        }

        .signup a {
            color: #007BFF;
            font-weight: bold;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

    <div class="login-box">
        <h2>Sign In</h2>
        <p>Enter your credentials to access your account</p>

        <form action="https://jenielhoumanggol.github.io/schoolproject/homepage.html">

            <label>Email Address</label>
            <input type="email" required>

            <label>Password</label>
            <input type="password" required>


            <button type="submit">Sign In</button>
        </form>

        <div class="signup"> 
            Don't have an account? 
            <a href="https://jenielhoumanggol.github.io/schoolproject/createaccount.html">Create one</a>
        </div>
    </div>

</body>
</html>
